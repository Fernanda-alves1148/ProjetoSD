services:
  redis-server:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  app-node-1:
    build: ./app-java
    ports:
      - "9081:8080"
    environment:
      - REDIS_URL=redis://redis-server:6379
      - NODE_NAME=NÓ-1
    depends_on:
      - redis-server

  app-node-2:
    build: ./app-java
    ports:
      - "9082:8080"
    environment:
      - REDIS_URL=redis://redis-server:6379
      - NODE_NAME=NÓ-2
    depends_on:
      - redis-server

  app-node-3:
    build: ./app-java
    ports:
      - "9083:8080"
    environment:
      - REDIS_URL=redis://redis-server:6379
      - NODE_NAME=NÓ-3
    depends_on:
      - redis-server